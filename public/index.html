<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Black Russia Cases</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>

    <!-- Экран загрузки -->
    <div id="splash-screen">
        <div class="loader"></div>
        <h2>ЗАГРУЗКА...</h2>
    </div>

    <!-- Основное приложение -->
    <div id="app" style="display: none;">
        
        <!-- Шапка -->
        <header>
            <div class="user-info">
                <span id="username">Loading...</span>
                <div class="balance">
                    <span id="balance">0</span> BC
                </div>
            </div>
        </header>

        <!-- Главный экран: Выбор кейсов -->
        <main id="main-screen">
            <h3>КЕЙСЫ</h3>
            <div class="cases-container">
                <!-- Кейс 1 -->
                <div class="case-card" onclick="openCaseMenu('novice')">
                    <img src="assets/case_common.png" alt="Case">
                    <div class="case-title">НОВИЧОК</div>
                    <div class="case-price">1000 BC</div>
                </div>
                <!-- Кейс 2 -->
                <div class="case-card rare" onclick="openCaseMenu('rich')">
                    <img src="assets/case_rare.png" alt="Case">
                    <div class="case-title">ОСОБЫЙ</div>
                    <div class="case-price">5000 BC</div>
                </div>
            </div>
        </main>

        <!-- Экран анимации открытия -->
        <div id="open-screen" class="hidden">
            <div class="roulette-container">
                <div id="roulette-track" class="roulette-track">
                    <!-- Сюда JS вставит предметы -->
                </div>
                <div class="roulette-marker"></div>
            </div>
            <div id="win-message" class="hidden">
                <h2>ТВОЙ ПРИЗ!</h2>
                <img id="win-img" src="" alt="">
                <h3 id="win-name">...</h3>
                <div class="actions">
                    <button class="btn btn-red" onclick="closeOpenScreen()">ЗАБРАТЬ</button>
                    <button class="btn btn-black" onclick="sellLastItem()">РАСПЫЛИТЬ</button>
                </div>
            </div>
        </div>

        <!-- Футер -->
        <footer>
            <button onclick="showScreen('main-screen')">ГЛАВНАЯ</button>
            <button onclick="alert('Скоро...')">ИНВЕНТАРЬ</button>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
